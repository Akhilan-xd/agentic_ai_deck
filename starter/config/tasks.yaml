research_task:
  description: Research {topic}. List the main facts, the open questions, and why they matter.
  expected_output: Bullet notes with facts and anything you are unsure about.
  agent: researcher

write_task:
  description: Using the research notes, write a brief on {topic} for a new teammate.
  expected_output: A short brief with a summary, key points, and next steps.
  agent: writer
  context:
    - research_task

edit_task:
  description: Edit the brief on {topic}. Keep every claim tied to the research notes.
  expected_output: The revised brief, plus a short list of cuts you made.
  agent: editor
  context:
    - write_task
